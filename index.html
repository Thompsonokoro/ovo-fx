<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0f1e">
<link rel="manifest" href="/manifest.json">
<title>Ovo FX - All Accounts Live</title>
<style>
body{background:#0a0f1e;color:white;font-family:Arial;padding:16px}
.card{background:#141c33;padding:16px;border-radius:14px;margin-bottom:12px}
.green{color:#00ff88}.red{color:#ff4444}
.big{font-size:28px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acc{border-left:4px solid #00ff88}
#installBtn{background:#00ff88;border:0;padding:14px;width:100%;border-radius:10px;font-weight:bold;font-size:16px;display:none}
#lock{max-width:400px;margin:60px auto;text-align:center;background:#141c33;padding:24px;border-radius:16px}
input{width:100%;padding:14px;border-radius:10px;border:0;margin:12px 0;font-size:18px;text-align:center}
button{padding:14px;width:100%;border-radius:10px;border:0;font-weight:bold;font-size:16px;background:#00ff88}
#app{display:none}
</style>
</head>
<body>
<div id="lock">
<h1>OVO FX 🔒</h1>
<p>Enter Password To View Accounts</p>
<input type="password" id="pwd" placeholder="Password">
<button onclick="unlock()">UNLOCK</button>
<p id="err" style="color:#ff4444"></p>
</div>

<div id="app">
<h1>OVO FX 🔥 ALL ACCOUNTS LIVE</h1>
<button id="installBtn">📲 DOWNLOAD APP TO YOUR PHONE</button>
<p id="updated">Connecting to all accounts...</p>
<div class="card"><b>TOTAL FOR ALL ACCOUNTS</b><div class="grid" style="margin-top:10px">
<div>Total Balance<div class="big" id="totalBalance">...</div></div>
<div>Total Equity<div class="big green" id="totalEquity">...</div></div>
<div>Total Profit<div class="big" id="totalProfit">...</div></div>
<div>Total Gain<div class="big" id="totalGain">...</div></div>
</div></div>
<div id="accounts"></div>
</div>

<script>
const MY_PASSWORD = "OVO2026";
function unlock(){
if(document.getElementById('pwd').value === MY_PASSWORD){
document.getElementById('lock').style.display='none';
document.getElementById('app').style.display='block';
localStorage.setItem('ovo_unlocked','yes');
loadReal();
} else {
document.getElementById('err').innerText = 'Wrong password, try again';
}
}
if(localStorage.getItem('ovo_unlocked')==='yes'){
document.getElementById('lock').style.display='none';
document.getElementById('app').style.display='block';
loadReal();
}
async function loadReal(){
  const r = await fetch('/api/live');
  const d = await r.json();
  document.getElementById('totalBalance').innerText = '$'+d.total.balance.toFixed(2);
  document.getElementById('totalEquity').innerText = '$'+d.total.equity.toFixed(2);
  let pEl = document.getElementById('totalProfit');
  pEl.innerText = '$'+d.total.profit.toFixed(2);
  pEl.style.color = d.total.profit >= 0 ? '#00ff88' : '#ff4444';
  document.getElementById('totalGain').innerText = d.total.gain.toFixed(2)+'%';
  document.getElementById('updated').innerText = 'Last updated: '+d.lastUpdate+' - '+d.accounts.length+' ACCOUNTS - REAL';
  let html = '';
  d.accounts.forEach(a=>{
    html += `<div class="card acc"><b>${a.name}</b> - ${a.broker} (${a.currency})<div class="grid" style="margin-top:10px"><div>Balance<div class="big">$${a.balance.toFixed(2)}</div></div><div>Equity<div class="big green">$${a.equity.toFixed(2)}</div></div><div>Profit<div class="big" style="color:${a.profit>=0?'#00ff88':'#ff4444'}">$${a.profit.toFixed(2)}</div></div><div>Gain<div class="big">${a.gain.toFixed(2)}%</div></div></div><div>Drawdown: ${a.drawdown.toFixed(2)}% | Deposit: $${a.deposit.toFixed(2)}</div></div>`;
  });
  document.getElementById('accounts').innerHTML = html;
}
setInterval(()=>{ if(document.getElementById('app').style.display==='block') loadReal(); }, 60000);
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click', async ()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none';}});
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
</script>
</body>
</html>
