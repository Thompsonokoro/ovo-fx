<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVO FX 🔥 ALL ACCOUNTS LIVE</title>
<meta name="theme-color" content="#050a1a">
<style>
body{background:#050a1a;color:white;font-family:Arial;padding:20px;margin:0}
.card{background:#0d1530;border-radius:16px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{color:#b0b8d0;font-size:14px}
.big{font-size:18px;font-weight:bold;margin-top:4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3560;background:#050a1a;color:white;box-sizing:border-box}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#ff6b00;color:white;font-weight:bold;font-size:16px;margin-top:10px}
.acct{background:#131d42;border-radius:12px;padding:12px;margin-top:10px}
.green{color:#00ff88}.red{color:#ff4444}
</style>
</head>
<body>
<h1>OVO FX 🔥 ALL ACCOUNTS<br>LIVE</h1>
<p id="status">Paste Token to connect...</p>
<div class="card" id="tokenBox">
<div class="small">Paste your MetaAPI Token</div>
<input id="tokenInput" placeholder="Paste Token here..." />
<button onclick="saveToken()">CONNECT LIVE</button>
<p class="small">Token dey save only for your phone.</p>
<button onclick="clearToken()" style="background:#333">CLEAR SAVED TOKEN</button>
</div>
<div class="card">
<b>TOTAL FOR ALL ACCOUNTS</b>
<div class="grid" style="margin-top:12px">
<div><div class="small">Total Balance</div><div class="big" id="tBal">...</div></div>
<div><div class="small">Total Equity</div><div class="big green" id="tEq">...</div></div>
<div><div class="small">Total Profit</div><div class="big" id="tProf">...</div></div>
<div><div class="small">Total Gain</div><div class="big" id="tGain">...</div></div>
</div>
</div>
<div id="accounts"></div>
<script>
let token = localStorage.getItem('ovo_token') || '';
if(token){ document.getElementById('tokenInput').value = token; document.getElementById('tokenBox').style.display='none'; connect(); }
function saveToken(){
  token = document.getElementById('tokenInput').value.trim();
  if(!token) return alert('Paste Token first');
  localStorage.setItem('ovo_token', token);
  document.getElementById('tokenBox').style.display='none';
  connect();
}
function clearToken(){ localStorage.removeItem('ovo_token'); location.reload(); }
// Try 4 ways - one go work
async function fetchApi(url){
  const headers = { 'auth-token': token };
  const tries = [
    url,
    'https://api.cors.lol/?url=' + encodeURIComponent(url),
    'https://corsproxy.io/?url=' + encodeURIComponent(url),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
  ];
  let lastErr = null;
  for(let u of tries){
    try{
      const r = await fetch(u, { headers });
      if(r.ok) return await r.json();
      // If 401/403, token problem - no need try others
      if(r.status===401 || r.status===403) throw new Error('Token invalid - Status '+r.status);
      lastErr = new Error('Status '+r.status+' via '+u.slice(0,30));
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Failed to fetch - all proxies blocked');
}
async function connect(){
  try{
    document.getElementById('status').innerText = 'Connecting... trying proxies...';
    const accounts = await fetchApi('https://mt-provisioning-api-v1.agiliumtrade.ai/users/current/accounts');
    if(!accounts.length){ document.getElementById('status').innerText='No account found'; document.getElementById('tokenBox').style.display='block'; return; }
    let totalBal=0, totalEq=0, totalProf=0, html='';
    for(let acc of accounts){
      try{
        const info = await fetchApi(`https://mt-client-api-v1.agiliumtrade.ai/users/current/accounts/${acc._id}/account-information`);
        let profit=0, posCount=0;
        try{
          const pos = await fetchApi(`https://mt-client-api-v1.agiliumtrade.ai/users/current/accounts/${acc._id}/positions`);
          if(Array.isArray(pos)){ posCount=pos.length; profit=pos.reduce((s,p)=>s+(p.profit||0),0); }
        }catch(e){}
        totalBal+=info.balance||0; totalEq+=info.equity||0; totalProf+=profit;
        html+=`<div class="acct"><b>${acc.name||acc.login} - ${acc.server||''}</b><br><span class="small">Login: ${acc.login}</span><br>Balance: $${(info.balance||0).toFixed(2)} | Equity: $${(info.equity||0).toFixed(2)}<br>Profit: <span class="${profit>=0?'green':'red'}">$${profit.toFixed(2)}</span> | Open: ${posCount}</div>`;
      }catch(e){ html+=`<div class="acct"><b>${acc.login}</b><br><span class="red">${e.message||e}</span></div>`; }
    }
    document.getElementById('tBal').innerText='$'+totalBal.toFixed(2);
    document.getElementById('tEq').innerText='$'+totalEq.toFixed(2);
    document.getElementById('tProf').innerText='$'+totalProf.toFixed(2);
    document.getElementById('tGain').innerText = totalBal>0 ? (((totalEq-totalBal)/totalBal*100).toFixed(2)+'%') : '0%';
    document.getElementById('accounts').innerHTML=html;
    document.getElementById('status').innerText='Live ✅ Connected - '+accounts.length+' account(s)';
    setTimeout(connect, 30000);
  }catch(e){
    document.getElementById('status').innerText='Error: '+(e.message||e);
    document.getElementById('tokenBox').style.display='block';
  }
}
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); }
</script>
</body>
</html>
